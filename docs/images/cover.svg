<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
<title id="title">Trayl — Already on the way.</title><desc id="desc">Your journey. Someone else's way forward. An illustrative ticket connects Lahore to Islamabad.</desc>
<rect width="1280" height="480" rx="20" fill="#0E1512"/>
<defs><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#9CA6A0" opacity=".12"/></pattern></defs><rect width="1280" height="480" fill="url(#dots)"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="64" y="91" fill="#F7F8F4" font-size="42" font-weight="700">Trayl<tspan fill="#27C285">.</tspan></text>
<text x="64" y="190" fill="#F7F8F4" font-size="54" font-weight="700" letter-spacing="-2">Your journey.</text><text x="64" y="256" fill="#27C285" font-size="54" font-weight="700" letter-spacing="-2">Someone else's</text><text x="64" y="322" fill="#27C285" font-size="54" font-weight="700" letter-spacing="-2">way forward.</text>
<text x="64" y="400" fill="#9CA6A0" font-size="21">Documents. Small packages. Journeys already happening.</text></g>
<g transform="translate(735 147)"><rect width="470" height="200" rx="12" fill="#123524" stroke="#9CA6A0" stroke-opacity=".3"/><g font-family="monospace"><text x="28" y="43" fill="#9CA6A0" font-size="13" letter-spacing="3">ALREADY ON THE WAY</text><text x="28" y="101" fill="#F7F8F4" font-size="23">LAHORE</text><path d="M148 93H290" stroke="#27C285" stroke-width="2" stroke-dasharray="6 5"/><path d="m283 86 8 7-8 7" fill="none" stroke="#27C285" stroke-width="2"/><text x="306" y="101" fill="#F7F8F4" font-size="23">ISLAMABAD</text><path d="M0 132H470" stroke="#9CA6A0" stroke-opacity=".3" stroke-dasharray="5 5"/><text x="28" y="172" fill="#9CA6A0" font-size="14">ONE ROUTE. TWO PEOPLE.</text><circle cx="430" cy="166" r="6" fill="#27C285"/></g></g></svg>